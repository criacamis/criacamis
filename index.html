document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

\">\n              <label style=\"display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#b9aea9\">Nome / título do card\n                <input value=\"{{ fr.who }}\" sc-camel-on-change=\"{{ fr.onWho }}\" placeholder=\"feedbacks\" style=\"font-family:Outfit;width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid #3a302c;background:#160e0c;color:#f6f3f1;font-size:15px;background:#1f1714\" style-focus=\"border-color:#ff00b7;outline:none\">\n              <\u002Flabel>\n              <label style=\"display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#b9aea9\">Mensagens\n                <textarea value=\"{{ fr.text }}\" sc-camel-on-change=\"{{ fr.onText }}\" rows=\"4\" style=\"font-family:Outfit;width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid #3a302c;background:#160e0c;color:#f6f3f1;font-size:15px;resize:vertical;line-height:1.5;background:#1f1714\" style-focus=\"border-color:#ff00b7;outline:none\"><\u002Ftextarea>\n              <\u002Flabel>\n              <div style=\"display:flex;gap:8px\">\n                <button sc-camel-on-click=\"{{ fr.up }}\" style=\"font-family:Outfit;width:32px;height:32px;border-radius:10px;border:1px solid #3a302c;background:transparent;color:#d8cfcb;cursor:pointer\">↑<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ fr.down }}\" style=\"font-family:Outfit;width:32px;height:32px;border-radius:10px;border:1px solid #3a302c;background:transparent;color:#d8cfcb;cursor:pointer\">↓<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ fr.remove }}\" style=\"margin-left:auto;font-family:Outfit;font-size:13px;font-weight:600;padding:0 14px;border-radius:999px;border:1.5px solid #6f7bff;background:transparent;color:#aab2ff;cursor:pointer\">excluir<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ tabWorks }}\" hint-placeholder-val=\"{{ true }}\">\n\n      <div style=\"padding:20px 24px;display:flex;flex-direction:column;gap:12px\">\n        <button sc-camel-on-click=\"{{ addWork }}\" style=\"font-family:Outfit;font-size:16px;font-weight:600;padding:14px;border-radius:999px;border:2px solid #160e0c;background:#ff00b7;color:#fff;cursor:pointer;box-shadow:3px 4px 0 #f6f3f1\">+ novo trabalho<\u002Fbutton>\n        <sc-for list=\"{{ rows }}\" as=\"r\" hint-placeholder-count=\"3\">\n          <div style=\"border:1.5px solid #3a302c;border-radius:18px;background:#160e0c;overflow:hidden\">\n            <div style=\"display:flex;align-items:center;gap:10px;padding:12px 12px 12px 16px\">\n              <span style=\"font-weight:700;font-size:13px;color:#ff00b7;width:22px\">{{ r.num }}<\u002Fspan>\n              <button sc-camel-on-click=\"{{ r.toggle }}\" style=\"all:unset;flex:1;min-width:0;cursor:pointer;display:flex;flex-direction:column;gap:2px\">\n                <span style=\"font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ r.titleLabel }}<\u002Fspan>\n                <span style=\"font-size:13px;color:#8f847f\">{{ r.category }}<\u002Fspan>\n              <\u002Fbutton>\n              <button sc-camel-on-click=\"{{ r.up }}\" title=\"Subir\" style=\"font-family:Outfit;width:32px;height:32px;border-radius:10px;border:1px solid #3a302c;background:transparent;color:#d8cfcb;cursor:pointer\">↑<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ r.down }}\" title=\"Descer\" style=\"font-family:Outfit;width:32px;height:32px;border-radius:10px;border:1px solid #3a302c;background:transparent;color:#d8cfcb;cursor:pointer\">↓<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ r.toggle }}\" style=\"font-family:Outfit;height:32px;padding:0 12px;border-radius:10px;border:1px solid #3a302c;background:transparent;color:#fff;font-size:13px;font-weight:600;cursor:pointer\">{{ r.toggleLabel }}<\u002Fbutton>\n            <\u002Fdiv>\n            <sc-if value=\"{{ r.editing }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex;flex-direction:column;gap:14px;padding:4px 16px 18px;border-top:1px solid #2e2522\">\n                <label style=\"display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#b9aea9;padding-top:14px\">Título\n                  <input value=\"{{ r.title }}\" sc-camel-on-change=\"{{ r.onTitle }}\" placeholder=\"ex: Liz Ateliê — feed\" style=\"font-family:Outfit;width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid #3a302c;background:#1f1714;color:#f6f3f1;font-size:15px\" style-focus=\"border-color:#ff00b7;outline:none\">\n                <\u002Flabel>\n                <label style=\"display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#b9aea9\">Categoria\n                  <input value=\"{{ r.category }}\" sc-camel-on-change=\"{{ r.onCategory }}\" placeholder=\"ex: Feed, Carrossel, Identidade\" list=\"cats-list\" style=\"font-family:Outfit;width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid #3a302c;background:#1f1714;color:#f6f3f1;font-size:15px\" style-focus=\"border-color:#ff00b7;outline:none\">\n                <\u002Flabel>\n                <label style=\"display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#b9aea9\">Link do Canva\n                  <input value=\"{{ r.canva }}\" sc-camel-on-change=\"{{ r.onCanva }}\" placeholder=\"Cole o link de visualização do Canva\" style=\"font-family:Outfit;width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid #3a302c;background:#1f1714;color:#f6f3f1;font-size:15px\" style-focus=\"border-color:#ff00b7;outline:none\">\n                  <span style=\"font-size:12px;font-weight:500;color:{{ r.linkColor }}\">{{ r.linkHint }}<\u002Fspan>\n                <\u002Flabel>\n                <label style=\"display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#b9aea9\">Descrição\n                  <textarea value=\"{{ r.desc }}\" sc-camel-on-change=\"{{ r.onDesc }}\" rows=\"3\" placeholder=\"Uma frase sobre o projeto\" style=\"font-family:Outfit;width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid #3a302c;background:#1f1714;color:#f6f3f1;font-size:15px;resize:vertical\" style-focus=\"border-color:#ff00b7;outline:none\"><\u002Ftextarea>\n                <\u002Flabel>\n                <label style=\"display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#b9aea9\">Capa (opcional — senão usa a prévia do Canva)\n                  <input value=\"{{ r.coverUrl }}\" sc-camel-on-change=\"{{ r.onCover }}\" placeholder=\"URL de uma imagem\" style=\"font-family:Outfit;width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid #3a302c;background:#1f1714;color:#f6f3f1;font-size:15px\" style-focus=\"border-color:#ff00b7;outline:none\">\n                  <input type=\"file\" accept=\"image/*\" sc-camel-on-change=\"{{ r.onCoverFile }}\" style=\"font-family:Outfit;font-size:13px;color:#b9aea9\">\n                <\u002Flabel>\n                <label style=\"display:flex;align-items:center;gap:10px;font-size:15px;font-weight:500;cursor:pointer\">\n                  <input type=\"checkbox\" checked=\"{{ r.featured }}\" sc-camel-on-change=\"{{ r.onFeatured }}\" style=\"width:18px;height:18px;accent-color:#ff00b7\">\n                  Destaque (card grande)\n                <\u002Flabel>\n                <button sc-camel-on-click=\"{{ r.remove }}\" style=\"align-self:flex-start;font-family:Outfit;font-size:14px;font-weight:600;padding:10px 16px;border-radius:999px;border:1.5px solid #6f7bff;background:transparent;color:#aab2ff;cursor:pointer\">excluir trabalho<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <datalist id=\"cats-list\">\n          <sc-for list=\"{{ catNames }}\" as=\"cn\" hint-placeholder-count=\"0\"><option value=\"{{ cn }}\"><\u002Foption><\u002Fsc-for>\n        <\u002Fdatalist>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ tabSocial }}\" hint-placeholder-val=\"{{ false }}\">\n\n      <div style=\"padding:8px 24px 20px;display:flex;flex-direction:column;gap:12px;border-top:1px solid #2e2522\">\n        <span style=\"font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#8f847f;padding-top:16px\">Contato<\u002Fspan>\n        <label style=\"display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#b9aea9\">Link do WhatsApp\n          <input value=\"{{ whatsapp }}\" sc-camel-on-change=\"{{ onWhats }}\" style=\"font-family:Outfit;width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid #3a302c;background:#160e0c;color:#f6f3f1;font-size:15px\" style-focus=\"border-color:#ff00b7;outline:none\">\n        <\u002Flabel>\n        <label style=\"display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#b9aea9\">Link do Instagram\n          <input value=\"{{ instagram }}\" sc-camel-on-change=\"{{ onInsta }}\" style=\"font-family:Outfit;width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid #3a302c;background:#160e0c;color:#f6f3f1;font-size:15px\" style-focus=\"border-color:#ff00b7;outline:none\">\n        <\u002Flabel>\n      <\u002Fdiv>\n\n      <div style=\"padding:8px 24px 20px;display:flex;flex-direction:column;gap:12px;border-top:1px solid #2e2522\">\n        <span style=\"font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#8f847f;padding-top:16px\">Posts do Instagram (6)<\u002Fspan>\n        <span style=\"font-size:13px;line-height:1.5;color:#8f847f\">Envie a imagem do post e, se quiser, o link dele. Sem link, abre o perfil.<\u002Fspan>\n        <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:10px\">\n          <sc-for list=\"{{ instaRows }}\" as=\"ir\" hint-placeholder-count=\"6\">\n            <div style=\"display:flex;flex-direction:column;gap:6px\">\n              <label style=\"position:relative;display:block;aspect-ratio:4/5;border-radius:12px;overflow:hidden;border:1.5px dashed #3a302c;background:#160e0c;cursor:pointer\">\n                <sc-if value=\"{{ ir.hasImg }}\" hint-placeholder-val=\"{{ false }}\">\n                  <img src=\"{{ ir.img }}\" alt=\"\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover\">\n                <\u002Fsc-if>\n                <sc-if value=\"{{ ir.empty }}\" hint-placeholder-val=\"{{ true }}\">\n                  <span style=\"position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:600;color:#8f847f\">+ imagem<\u002Fspan>\n                <\u002Fsc-if>\n                <input type=\"file\" accept=\"image/*\" sc-camel-on-change=\"{{ ir.onFile }}\" style=\"display:none\">\n              <\u002Flabel>\n              <input value=\"{{ ir.link }}\" sc-camel-on-change=\"{{ ir.onLink }}\" placeholder=\"link do post\" style=\"font-family:Outfit;width:100%;padding:8px 10px;border-radius:10px;border:1px solid #3a302c;background:#160e0c;color:#f6f3f1;font-size:12px\" style-focus=\"border-color:#ff00b7;outline:none\">\n              <sc-if value=\"{{ ir.hasImg }}\" hint-placeholder-val=\"{{ false }}\">\n                <button sc-camel-on-click=\"{{ ir.clear }}\" style=\"font-family:Outfit;font-size:12px;padding:4px;border:0;background:transparent;color:#aab2ff;cursor:pointer\">remover<\u002Fbutton>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <\u002Fsc-if>\n\n      <div style=\"padding:8px 24px 20px;display:flex;flex-direction:column;gap:12px;border-top:1px solid #2e2522\">\n        <button sc-camel-on-click=\"{{ togglePubCfg }}\" style=\"all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding-top:16px\">\n          <span style=\"font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#8f847f\">Conexão GitHub<\u002Fspan>\n          <span style=\"font-size:13px;font-weight:600;color:{{ pubCfgColor }}\">{{ pubCfgLabel }}<\u002Fspan>\n        <\u002Fbutton>\n        <sc-if value=\"{{ pubCfgOpen }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:12px\">\n            <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px\">\n              <label style=\"display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#b9aea9\">Usuário\n                <input value=\"{{ pub.owner }}\" sc-camel-on-change=\"{{ onPubOwner }}\" placeholder=\"seu-usuario\" style=\"font-family:Outfit;width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid #3a302c;background:#160e0c;color:#f6f3f1;font-size:15px\" style-focus=\"border-color:#ff00b7;outline:none\">\n              <\u002Flabel>\n              <label style=\"display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#b9aea9\">Repositório\n                <input value=\"{{ pub.repo }}\" sc-camel-on-change=\"{{ onPubRepo }}\" placeholder=\"criacamis\" style=\"font-family:Outfit;width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid #3a302c;background:#160e0c;color:#f6f3f1;font-size:15px\" style-focus=\"border-color:#ff00b7;outline:none\">\n              <\u002Flabel>\n            <\u002Fdiv>\n            <label style=\"display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#b9aea9\">Token de acesso\n              <input type=\"password\" value=\"{{ pub.token }}\" sc-camel-on-change=\"{{ onPubToken }}\" placeholder=\"github_pat_…\" style=\"font-family:Outfit;width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid #3a302c;background:#160e0c;color:#f6f3f1;font-size:15px\" style-focus=\"border-color:#ff00b7;outline:none\">\n              <span style=\"font-size:12px;font-weight:500;line-height:1.5;color:#8f847f\">Fica salvo só neste navegador. GitHub → Settings → Developer settings → Fine-grained tokens → acesso só a este repositório, permissão <b style=\"color:#d8cfcb\">Contents: Read and write<\u002Fb>.<\u002Fspan>\n            <\u002Flabel>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:auto;position:sticky;bottom:0;padding:20px 24px 24px;display:flex;flex-direction:column;gap:12px;border-top:1px solid #2e2522;background:#1a1311\">\n        <sc-if value=\"{{ hasPubStatus }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:12px 14px;border-radius:14px;background:{{ pubStatusBg }};color:#fff;font-size:14px;font-weight:500;line-height:1.45;display:flex;flex-direction:column;gap:10px\">{{ pubStatus }}\n            <sc-if value=\"{{ showLive }}\" hint-placeholder-val=\"{{ false }}\"><a href=\"{{ liveUrl }}\" target=\"_blank\" rel=\"noopener\" style=\"align-self:flex-start;padding:8px 14px;border-radius:999px;background:#fff;color:#160e0c;font-weight:600;font-size:14px\" style-hover=\"color:#160e0c\">ver site no ar ↗<\u002Fa><\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <button sc-camel-on-click=\"{{ publish }}\" disabled=\"{{ publishing }}\" style=\"font-family:Outfit;font-size:17px;font-weight:700;padding:16px;border-radius:999px;border:2px solid #160e0c;background:#ff00b7;color:#fff;cursor:pointer;box-shadow:4px 5px 0 #0c00ff;opacity:{{ pubOpacity }}\" style-active=\"transform:translate(3px,4px);box-shadow:0 0 0 #0c00ff\">{{ publishLabel }}<\u002Fbutton>\n        <span style=\"font-size:12px;line-height:1.5;color:#8f847f;text-align:center\">{{ draftNote }}<\u002Fspan>\n        <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n          <button sc-camel-on-click=\"{{ exportJson }}\" style=\"font-family:Outfit;font-size:14px;font-weight:600;padding:10px 16px;border-radius:999px;border:1.5px solid #f6f3f1;background:#f6f3f1;color:#160e0c;cursor:pointer\">exportar dados<\u002Fbutton>\n          <label style=\"font-size:14px;font-weight:600;padding:10px 16px;border-radius:999px;border:1.5px solid #3a302c;color:#f6f3f1;cursor:pointer\">importar\n            <input type=\"file\" accept=\"application/json\" sc-camel-on-change=\"{{ importJson }}\" style=\"display:none\">\n          <\u002Flabel>\n          <button sc-camel-on-click=\"{{ resetData }}\" style=\"font-family:Outfit;font-size:14px;font-weight:500;padding:10px 16px;border-radius:999px;border:1.5px solid #3a302c;background:transparent;color:#8f847f;cursor:pointer\">restaurar exemplo<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Faside>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst KEY = \"criacamis-portfolio-v1\";\nconst CANVA = \"https://www.canva.com/design/DAHD3zwq8Fo/EKaXQhZg3vkb5Eoy0RlfjA/view\";\nconst DEFAULT = {\n  settings: { whatsapp: \"https://wa.me/5534900000000\", instagram: \"https://instagram.com/_criacamis\" },\n  site: {\n    brand: \"criacamis\", heroEyebrow: \"@_criacamis · design de post & identidade\", heroTitle1: \"POST\", heroTitle2: \"folio\",\n    heroText: \"Um compilado de artes criadas para marcas de diferentes nichos. Clique em um trabalho para ver a apresentação completa.\",\n    heroBtn1: \"ver trabalhos\", heroBtn2: \"bora criar junto?\", heroPhoto: \"\", avatar: \"\",\n    worksTitle: \"Trabalhos\", worksAccent: \"que eu criei\", fbTitle: \"meu trabalho\", fbAccent: \"é sobre isso!\",\n    instaSub: \"acompanha o dia a dia no Instagram\", contactTitle: \"pense diferente\", contactAccent: \"bora criar junto?\",\n    whatsBtn: \"chamar no WhatsApp\", footer: \"© criacamis — design de post & identidade\"\n  },\n  feedbacks: [\n    { id: \"f1\", who: \"feedbacks\", text: \"Então te agradeço parceria boa com você.\\nResultado bom para nós!\" },\n    { id: \"f2\", who: \"feedbacks\", text: \"Oie amiga, boa noite, tudo bem?\\nficaram lindoss\\nmuito obrigado viu ❤️\" },\n    { id: \"f3\", who: \"feedbacks\", text: \"você é a melhor amiga, eu adorei\\neu vou mandar pra ele aprovar\" }\n  ],\n  works: [\n    { id: \"w1\", title: \"Portfólio de posts\", category: \"Design de post\", canva: CANVA, desc: \"Um compilado de artes desenvolvidas em diferentes nichos.\", cover: \"\", featured: true },\n    { id: \"w2\", title: \"Ateliê — feed\", category: \"Feed\", canva: CANVA, desc: \"Planejamento visual e posts para um ateliê de costura.\", cover: \"\", featured: false },\n    { id: \"w3\", title: \"Linha capilar\", category: \"Carrossel\", canva: CANVA, desc: \"Carrosséis educativos para uma marca de cuidados com o cabelo.\", cover: \"\", featured: false },\n    { id: \"w4\", title: \"Stories de feedback\", category: \"Stories\", canva: CANVA, desc: \"Templates de stories para mostrar depoimentos de clientes.\", cover: \"\", featured: false }\n  ]\n};\nfunction parseCanva(u) {\n  const m = (u || \"\").match(/canva\\.com\\/design\\/([^/]+)\\/([^/?#]+)/);\n  return m ? { embed: `https://www.canva.com/design/${m[1]}/${m[2]}/view?embed`, pub: `https://www.canva.com/design/${m[1]}/${m[2]}/view` } : null;\n}\nconst pad = n => String(n).padStart(2, \"0\");\nfunction normalize(d) { const D = JSON.parse(JSON.stringify(DEFAULT)); return { ...D, ...d, settings: { ...D.settings, ...(d.settings || {}) }, site: { ...D.site, ...(d.site || {}) }, feedbacks: d.feedbacks || D.feedbacks, works: d.works || D.works }; }\nconst ADMINKEY = \"criacamis-owner\";\nconst readFileAsData = (e, cb) => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => cb(r.result); r.readAsDataURL(f); };\nconst PUBKEY = \"criacamis-github-v1\";\nfunction guessRepo() {\n  const h = location.hostname.match(/^([^.]+)\\.github\\.io$/);\n  if (!h) return { owner: \"\", repo: \"\" };\n  const seg = location.pathname.split(\"/\").filter(Boolean)[0];\n  return { owner: h[1], repo: seg && !seg.includes(\".\") ? seg : h[1] + \".github.io\" };\n}\nfunction b64(str) { const bytes = new TextEncoder().encode(str); let bin = \"\"; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(bin); }\nfunction hashStr(s) { let h = 5381; for (let i = 0; i < s.length; i += 7) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0; return h.toString(36) + s.length.toString(36); }\n\nclass Component extends DCLogic {\n  state = { data: this.load(), filter: \"Todos\", openId: null, adminOpen: false, editId: null, share: null, copied: \"\", tab: \"works\", isOwner: (() => { try { return !!localStorage.getItem(ADMINKEY); } catch (e) { return false; } })(), pub: this.loadPub(), pubCfgOpen: false, publishing: false, pubStatus: \"\", pubOk: true };\n  loadPub() { const g = guessRepo(); try { const p = JSON.parse(localStorage.getItem(PUBKEY)); if (p) return { owner: p.owner || g.owner, repo: p.repo || g.repo, token: p.token || \"\", branch: p.branch || \"main\" }; } catch (e) {} return { ...g, token: \"\", branch: \"main\" }; }\n  setPub(patch) { const pub = { ...this.state.pub, ...patch }; this.setState({ pub }); try { localStorage.setItem(PUBKEY, JSON.stringify(pub)); } catch (e) {} }\n  async gh(path, opts = {}) {\n    const { owner, repo, token } = this.state.pub;\n    const r = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`, { ...opts, headers: { Authorization: \"Bearer \" + token, Accept: \"application/vnd.github+json\", ...(opts.headers || {}) } });\n    return r;\n  }\n  async putFile(path, contentB64, message) {\n    const branch = this.state.pub.branch || \"main\";\n    let sha;\n    const g = await this.gh(path + \"?ref=\" + branch);\n    if (g.ok) sha = (await g.json()).sha; else if (g.status === 401) throw new Error(\"Token inválido ou expirado.\"); else if (g.status === 404 && path === \"dados.json\") { const t = await this.gh(\"?ref=\" + branch); if (t.status === 404) throw new Error(\"Repositório não encontrado. Confira usuário e nome.\"); }\n    const p = await this.gh(path, { method: \"PUT\", body: JSON.stringify({ message, content: contentB64, branch, ...(sha ? { sha } : {}) }) });\n    if (!p.ok) { const e = await p.json().catch(() => ({})); throw new Error(p.status === 403 || p.status === 404 ? \"Sem permissão para escrever. O token precisa de Contents: Read and write neste repositório.\" : (e.message || \"Erro \" + p.status)); }\n  }\n  async doPublish() {\n    const { owner, repo, token } = this.state.pub;\n    if (!owner || !repo || !token) { this.setState({ pubCfgOpen: true, pubOk: false, pubStatus: \"Preencha usuário, repositório e token da conexão GitHub.\" }); return; }\n    this.setState({ publishing: true, pubOk: true, pubStatus: \"Enviando imagens…\", justPublished: false });\n    try {\n      const data = JSON.parse(JSON.stringify(this.state.data));\n      const up = async (url) => {\n        if (!url || !url.startsWith(\"data:\")) return url;\n        const m = url.match(/^data:image\\/(\\w+);base64,(.*)$/); if (!m) return url;\n        const path = `imagens/${hashStr(m[2])}.${m[1] === \"jpeg\" ? \"jpg\" : m[1]}`;\n        await this.putFile(path, m[2], \"Imagem do portfólio\");\n        return path;\n      };\n      for (const w of data.works) w.cover = await up(w.cover);\n      for (const p of (data.settings.instaPosts || [])) if (p) p.img = await up(p.img);\n      data.site.heroPhoto = await up(data.site.heroPhoto); data.site.avatar = await up(data.site.avatar);\n      this.setState({ pubStatus: \"Publicando trabalhos…\" });\n      await this.putFile(\"dados.json\", b64(JSON.stringify(data, null, 2)), \"Atualiza portfólio\");\n      try { localStorage.removeItem(KEY); } catch (e) {}\n      this.isDraft = false; this.dirty = false;\n      this.setState({ data, publishing: false, pubOk: true, pubStatus: \"Publicado! ✨ Em 1–2 minutos o site atualiza para todo mundo.\", justPublished: true });\n    } catch (err) {\n      this.setState({ publishing: false, pubOk: false, pubStatus: String(err.message || err) });\n    }\n  }\n  baseUrl() { return location.href.split(\"#\")[0]; }\n  openShare(title, url, text) { this.setState({ share: { title, url, text }, copied: \"\" }); }\n  async copy(txt, which) {\n    try { await navigator.clipboard.writeText(txt); } catch (e) { const t = document.createElement(\"textarea\"); t.value = txt; document.body.appendChild(t); t.select(); try { document.execCommand(\"copy\"); } catch (x) {} t.remove(); }\n    this.setState({ copied: which });\n  }\n  load() {\n    try { const d = JSON.parse(localStorage.getItem(KEY)); if (d && d.works) { this.isDraft = true; return normalize(d); } } catch (e) {}\n    return normalize({});\n  }\n  save(data) { this.isDraft = true; this.dirty = true; this.setState({ data, pubStatus: \"\" }); try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { alert(\"Não foi possível salvar — imagem de capa muito grande. Use uma URL.\"); } }\n  componentDidMount() {\n    this.onKey = e => {\n      if (!this.state.openId) return;\n      if (e.key === \"Escape\") { if (this.state.share) return this.setState({ share: null }); this.setState({ openId: null }); }\n      if (e.key === \"ArrowRight\") this.step(1);\n      if (e.key === \"ArrowLeft\") this.step(-1);\n    };\n    window.addEventListener(\"keydown\", this.onKey);\n    if (!this.isDraft) fetch(\"dados.json\", { cache: \"no-store\" }).then(r => r.ok ? r.json() : null).then(d => { if (d && d.works) { this.setState({ data: normalize(d) }); const m = location.hash.match(/^#trabalho-(.+)$/); if (m && d.works.some(w => w.id === m[1])) this.setState({ openId: m[1] }); } }).catch(() => {});\n    if (location.hash === \"#admin\") { try { localStorage.setItem(ADMINKEY, \"1\"); } catch (e) {} this.setState({ adminOpen: true, isOwner: true }); }\n    const m = location.hash.match(/^#trabalho-(.+)$/);\n    if (m && this.state.data.works.some(w => w.id === m[1])) this.setState({ openId: m[1] });\n  }\n  componentWillUnmount() { window.removeEventListener(\"keydown\", this.onKey); }\n  visible() {\n    const { data, filter } = this.state;\n    return filter === \"Todos\" ? data.works : data.works.filter(w => w.category === filter);\n  }\n  step(d) {\n    const list = this.visible(); if (!list.length) return;\n    const i = list.findIndex(w => w.id === this.state.openId);\n    this.setState({ openId: list[(i + d + list.length) % list.length].id });\n  }\n  updateWork(id, patch) {\n    const data = this.state.data;\n    this.save({ ...data, works: data.works.map(w => w.id === id ? { ...w, ...patch } : w) });\n  }\n  move(id, d) {\n    const works = [...this.state.data.works]; const i = works.findIndex(w => w.id === id); const j = i + d;\n    if (j < 0 || j >= works.length) return;\n    [works[i], works[j]] = [works[j], works[i]];\n    this.save({ ...this.state.data, works });\n  }\n  decorate(w, idx) {\n    const c = parseCanva(w.canva);\n    const hasCover = !!w.cover;\n    return {\n      ...w, num: pad(idx + 1), embed: c ? c.embed : \"\", publicUrl: c ? c.pub : (w.canva || \"#\"),\n      hasCover, useEmbed: !hasCover && !!c\n    };\n  }\n  renderVals() {\n    const { data, filter, openId, adminOpen, editId } = this.state;\n    const all = data.works;\n    const catNames = [...new Set(all.map(w => w.category).filter(Boolean))];\n    const cats = [\"Todos\", ...catNames].map(label => ({ label, active: label === filter, inactive: label !== filter, pick: () => this.setState({ filter: label }) }));\n    const colors = [\"rosa\", \"azul\", \"branco\"];\n    const items = this.visible().map((w, i) => {\n      const d = this.decorate(w, all.indexOf(w));\n      const sc = colors[i % 3];\n      return { ...d, span: w.featured ? \"1 / -1\" : \"auto\", ratio: w.featured ? \"16 / 7\" : \"16 / 10\", starColor: sc, numColor: sc === \"branco\" ? \"#160e0c\" : \"#fff\", open: () => this.setState({ openId: w.id }) };\n    });\n    const cur = all.find(w => w.id === openId);\n    const v = cur ? this.decorate(cur, all.indexOf(cur)) : {};\n    const rows = all.map((w, i) => {\n      const c = parseCanva(w.canva);\n      const editing = editId === w.id;\n      return {\n        ...w, num: pad(i + 1), titleLabel: w.title || \"Sem título\", editing, toggleLabel: editing ? \"fechar\" : \"editar\",\n        coverUrl: w.cover && w.cover.startsWith(\"data:\") ? \"\" : w.cover,\n        linkHint: !w.canva ? \"Canva → Compartilhar → Link de visualização\" : c ? \"✓ link reconhecido\" : \"Link não reconhecido — use um link canva.com/design/…\",\n        linkColor: !w.canva ? \"#8f847f\" : c ? \"#ff7fd6\" : \"#aab2ff\",\n        toggle: () => this.setState({ editId: editing ? null : w.id }),\n        up: () => this.move(w.id, -1), down: () => this.move(w.id, 1),\n        onTitle: e => this.updateWork(w.id, { title: e.target.value }),\n        onCategory: e => this.updateWork(w.id, { category: e.target.value }),\n        onCanva: e => this.updateWork(w.id, { canva: e.target.value.trim() }),\n        onDesc: e => this.updateWork(w.id, { desc: e.target.value }),\n        onCover: e => this.updateWork(w.id, { cover: e.target.value.trim() }),\n        onCoverFile: e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => this.updateWork(w.id, { cover: r.result }); r.readAsDataURL(f); },\n        onFeatured: e => this.updateWork(w.id, { featured: e.target.checked }),\n        remove: () => { if (confirm(`Excluir “${w.title || \"sem título\"}”?`)) { this.save({ ...data, works: all.filter(x => x.id !== w.id) }); } }\n      };\n    });\n    const n = all.length;\n    const st = data.settings;\n    const posts = st.instaPosts || [];\n    const formas = [\"A\", \"B\", \"C\", \"D\", \"A\", \"B\"], cores = [\"rosa\", \"azul\", \"branco\", \"rosa\", \"azul\", \"branco\"];\n    const instaPosts = [0,1,2,3,4,5].map(i => { const p = posts[i] || {}; return { img: p.img || \"\", hasImg: !!p.img, empty: !p.img, href: p.link || st.instagram, forma: formas[i], cor: cores[i] }; });\n    const setPost = (i, patch) =
